apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-aws-auth
  namespace: analytics-service
spec:
  # Use IRSA (pod identity) instead of static AWS keys.
  # KEDA assumes the analytics-service IAM role via the workload's
  # service account identity webhook.
  podIdentity:
    provider: aws
    identityOwner: workload
