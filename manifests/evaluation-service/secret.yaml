apiVersion: v1
kind: Secret
metadata:
  name: evaluation-service-secret
  namespace: evaluation-service
type: Opaque
# AWS credentials are provided by IRSA via the service account annotation.
# SERVICE_API_KEY is generated after auth-service is deployed:
#   POST http://<NLB>/auth/api-keys  with MASTER_KEY header
# then update this secret with the base64-encoded value and push.
data:
  SERVICE_API_KEY: ""
