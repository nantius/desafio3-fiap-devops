name: targeting-service CI/CD

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
    paths:
      - "targeting-service/**"
      - ".github/workflows/targeting-service.yml"
      - ".github/workflows/reusable-python.yml"
  pull_request:
    branches: [master]
    paths:
      - "targeting-service/**"
      - ".github/workflows/targeting-service.yml"
      - ".github/workflows/reusable-python.yml"

jobs:
  pipeline:
    uses: ./.github/workflows/reusable-python.yml
    with:
      service: targeting-service
      ecr_repository: targeting-service
      port: "8003"
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
